name: Deploy to Firebase Hosting on merge
"on":
  push:
    branches:
      - tunaxors-blog
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: npm i -g pnpm
      - run: cd src/Hosted && pnpm i
      - run: dotnet clean && dotnet build SiteFi.sln
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_TUNAXORS_BLOG }}"
          channelId: live
          projectId: tunaxors-blog
